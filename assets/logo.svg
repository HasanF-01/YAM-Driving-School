<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="YAM — Youssef Ahmad Moussawi">
  <title>YAM — Youssef Ahmad Moussawi</title>

  <!-- YAM wordmark -->
  <text x="360" y="178"
        text-anchor="middle"
        font-family="'Arial Black', Impact, 'Segoe UI', sans-serif"
        font-size="175" font-weight="900" letter-spacing="6"
        fill="#1E4076">YAM</text>

  <!-- car silhouette: white halo first, then navy outline (mimics the cut-through look) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70,205
             C72,182 100,170 140,166
             L200,160
             C230,133 285,124 340,132
             C390,139 430,152 470,166
             L530,178
             C552,184 558,192 552,205
             L524,205
             Q490,158 456,205
             L209,205
             Q175,158 141,205
             Z"
          stroke="#ffffff" stroke-width="18"/>
    <path d="M70,205
             C72,182 100,170 140,166
             L200,160
             C230,133 285,124 340,132
             C390,139 430,152 470,166
             L530,178
             C552,184 558,192 552,205
             L524,205
             Q490,158 456,205
             L209,205
             Q175,158 141,205
             Z"
          stroke="#1E4076" stroke-width="7"/>

    <!-- windshield / side crease -->
    <path d="M212,158 C242,136 290,130 336,137" stroke="#ffffff" stroke-width="14"/>
    <path d="M212,158 C242,136 290,130 336,137" stroke="#1E4076" stroke-width="5"/>

    <path d="M150,182 C215,172 320,168 430,178" stroke="#ffffff" stroke-width="12"/>
    <path d="M150,182 C215,172 320,168 430,178" stroke="#1E4076" stroke-width="4"/>

    <!-- headlight sweep -->
    <path d="M84,186 C104,178 128,175 152,175" stroke="#ffffff" stroke-width="12"/>
    <path d="M84,186 C104,178 128,175 152,175" stroke="#1E4076" stroke-width="4"/>
  </g>

  <!-- name -->
  <text x="360" y="268"
        text-anchor="middle"
        font-family="'Segoe UI', Tahoma, Arial, sans-serif"
        font-size="44" font-weight="500" letter-spacing="1"
        fill="#4A6E9C">Youssef Ahmad Moussawi</text>

  <!-- arabic tagline -->
  <text x="360" y="320"
        text-anchor="middle" direction="rtl"
        font-family="Cairo, Tahoma, 'Segoe UI', Arial, sans-serif"
        font-size="32" font-weight="500"
        fill="#4A6E9C">تخليص كافة معاملات هيئة إدارة السير</text>
</svg>
